name: hh-zk
services:
  zk1:
    image: zookeeper:3.9.6
    container_name: zk1
    hostname: zk1
    ports: ["2181:2181"]
    environment: { ZOO_MY_ID: "1" }
    volumes:
      - ./zk1/zoo.cfg:/conf/zoo.cfg
      - zk1-data:/data
      - zk1-datalog:/datalog
  zk2:
    image: zookeeper:3.9.6
    container_name: zk2
    hostname: zk2
    ports: ["2182:2182"]
    environment: { ZOO_MY_ID: "2" }
    volumes:
      - ./zk2/zoo.cfg:/conf/zoo.cfg
      - zk2-data:/data
      - zk2-datalog:/datalog
  zk3:
    image: zookeeper:3.9.6
    container_name: zk3
    hostname: zk3
    ports: ["2183:2183"]
    environment: { ZOO_MY_ID: "3" }
    volumes:
      - ./zk3/zoo.cfg:/conf/zoo.cfg
      - zk3-data:/data
      - zk3-datalog:/datalog
volumes:
  zk1-data: {}
  zk1-datalog: {}
  zk2-data: {}
  zk2-datalog: {}
  zk3-data: {}
  zk3-datalog: {}